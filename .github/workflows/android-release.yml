name: Android Release Google Play

# Manual dispatch only. Builds the selected flavor via the existing Fastlane
# lane `fastlane android <env>` (see fastlane/Fastfile) and uploads the AAB to
# the selected Google Play track. The GitHub Environment matching `env`
# supplies the secrets, so give the `production` environment required reviewers.
#
# The build is skipped when a build with the same expo-updates fingerprint and
# env file was already uploaded to the same track from a run of this workflow:
# ship JS-only changes with `yarn eas:update:<env>` instead, or set
# `force_build` (for example to bump ANDROID_APP_VERSION_NAME).
on:
  workflow_dispatch:
    inputs:
      env:
        description: App environment (flavor)
        type: choice
        options: [staging, production]
        default: staging
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      force_build:
        description: Build even if this native fingerprint was already uploaded
        type: boolean
        default: false

concurrency:
  group: android-release-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --ci

  build-and-upload:
    name: Build ${{ inputs.env }} & upload to Google Play (${{ inputs.track }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.env }}
    env:
      ENVFILE: .env.${{ inputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=()
          for var_name in APP_ENV_FILE ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_STORE_JSON_KEY_BASE64; do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets in the '${{ inputs.env }}' environment:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

      - name: Materialize env file
        # The whole .env.<env> file is stored as the APP_ENV_FILE secret of the
        # matching GitHub Environment (update it with `yarn env:push:<env>`).
        # Everything in it is bundled into the app by react-native-config, so it
        # must never contain signing passwords or other credentials.
        # The versionCode is not taken from this file: fastlane uses the highest
        # version code on Google Play + 1 (see next_android_version_code).
        run: |
          set -euo pipefail
          printf '%s\n' "$APP_ENV_FILE" | tr -d '\r' > "$ENVFILE"
          for key in APP_ENV API_BASE_URL ANDROID_BUNDLE_ID ANDROID_APP_VERSION_NAME ANDROID_APP_VERSION_CODE APP_NAME; do
            if ! grep -q "^${key}=" "$ENVFILE"; then
              echo "Missing ${key} in APP_ENV_FILE for '${{ inputs.env }}'." >&2
              exit 1
            fi
          done
          app_env="$(grep '^APP_ENV=' "$ENVFILE" | cut -d= -f2-)"
          api_base_url="$(grep '^API_BASE_URL=' "$ENVFILE" | cut -d= -f2-)"
          if [ "$app_env" != "${{ inputs.env }}" ]; then
            echo "APP_ENV in APP_ENV_FILE must match '${{ inputs.env }}'." >&2
            exit 1
          fi
          case "$api_base_url" in
            https://*) ;;
            *) echo "API_BASE_URL in APP_ENV_FILE must be an HTTPS URL." >&2; exit 1 ;;
          esac
          echo "Package: $(grep '^ANDROID_BUNDLE_ID=' "$ENVFILE" | cut -d= -f2-)"
          echo "Version name: $(grep '^ANDROID_APP_VERSION_NAME=' "$ENVFILE" | cut -d= -f2-)"
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Compute expo-updates fingerprint and release key
        # The fingerprint is the runtime version this build embeds. An EAS update
        # reaches it only when `eas update` prints the same runtime version for
        # android. react-native-config compiles the env file into the app, so the
        # release key also covers it.
        id: release-key
        run: |
          set -euo pipefail
          fingerprint="$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "Android runtime version (fingerprint): $fingerprint"
          echo "Android runtime version (fingerprint): \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
          env_hash="$(sha256sum "$ENVFILE" | cut -c1-16)"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'key=android-release-%s-%s-%s-%s\n' "${{ inputs.env }}" "${{ inputs.track }}" "$fingerprint" "$env_hash" >> "$GITHUB_OUTPUT"

      - name: Look up previous build with the same fingerprint
        id: previous
        uses: actions/cache/restore@v5
        with:
          path: .release-marker
          key: ${{ steps.release-key.outputs.key }}
          lookup-only: true

      - name: Decide whether to build
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ steps.previous.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force_build }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: native build already on Google Play (${{ inputs.track }})"
              echo ""
              echo "A build with Android fingerprint \`${{ steps.release-key.outputs.fingerprint }}\` and the same env file was already uploaded to this track."
              echo "Ship JS changes with \`yarn eas:update:${{ inputs.env }} \"<message>\"\`, or re-run with **force_build** to upload a new binary."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipped: fingerprint ${{ steps.release-key.outputs.fingerprint }} was already uploaded to ${{ inputs.track }}. Use EAS Update or force_build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        # Caches Gradle dependencies, wrappers and the build cache, and saves them
        # again after each run (setup-java's `cache: gradle` only saved them when
        # the build scripts changed, so the build cache went stale).
        if: steps.gate.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Ruby (bundler)
        if: steps.gate.outputs.build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - name: Tune Gradle for CI
        # ~/.gradle/gradle.properties overrides android/gradle.properties (-Xmx2048m),
        # so this only affects CI. GitHub's Linux runners have 16 GB RAM.
        if: steps.gate.outputs.build == 'true'
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Install ccache
        if: steps.gate.outputs.build == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Restore ccache
        # Native (C++) objects from earlier runs. A new key every run so the cache is
        # always saved; restore-keys picks up the most recent one.
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ runner.os }}-

      - name: Materialize Android signing files
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/lingobites-android-signing"
          mkdir -p "$signing_dir"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/upload.jks"
          printf '%s' "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > "$signing_dir/play-service-account.json"

          test -s "$signing_dir/upload.jks"
          test -s "$signing_dir/play-service-account.json"

          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$signing_dir/upload.jks" >> "$GITHUB_ENV"
          printf 'PLAY_STORE_JSON_KEY_FILE=%s\n' "$signing_dir/play-service-account.json" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

      - name: Build and upload to Google Play (fastlane android ${{ inputs.env }})
        if: steps.gate.outputs.build == 'true'
        run: bundle exec fastlane android ${{ inputs.env }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_TRACK: ${{ inputs.track }}
          PLAY_STORE_RELEASE_STATUS: completed
          # Embed the fingerprint computed above on the clean checkout. Computed
          # inside Gradle it also hashes files the build itself creates (for
          # example Kotlin's .kotlin/ session dirs), so the app would carry a
          # runtime version no `eas update` ever matches.
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.release-key.outputs.fingerprint }}
          # CMake (>= 3.17) reads these from the environment, so every native module
          # built by the NDK compiles through ccache.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPRESS: 'true'
          CCACHE_MAXSIZE: 2G
          # Codegen headers are regenerated each build, so ignore their timestamps.
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros

      - name: Show ccache stats
        if: always() && steps.gate.outputs.build == 'true'
        run: ccache -s || true

      - name: Verify embedded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          aab="$(ls android/app/build/outputs/bundle/${{ inputs.env }}Release/*.aab | head -n 1)"
          embedded="$(unzip -p "$aab" base/assets/fingerprint)"
          echo "Embedded runtime version: $embedded"
          if [ "$embedded" != "${{ steps.release-key.outputs.fingerprint }}" ]; then
            echo "::error::The AAB embeds runtime version $embedded, expected ${{ steps.release-key.outputs.fingerprint }}. EAS updates will not reach this build."
            exit 1
          fi

      - name: Upload AAB artifact
        if: success() && steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lingobites-${{ inputs.env }}-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/${{ inputs.env }}Release/*.aab
          retention-days: 14

      - name: Record uploaded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        run: |
          mkdir -p .release-marker
          printf 'run=%s\nfingerprint=%s\n' "${{ github.run_id }}" "${{ steps.release-key.outputs.fingerprint }}" > .release-marker/info.txt

      - name: Save uploaded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        uses: actions/cache/save@v5
        with:
          path: .release-marker
          key: ${{ steps.release-key.outputs.key }}

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$ENVFILE"
          rm -rf "$RUNNER_TEMP/lingobites-android-signing"
