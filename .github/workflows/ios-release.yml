name: iOS Release TestFlight

# Manual dispatch only. Builds the selected scheme via the existing Fastlane
# lane `fastlane ios <env>` (see fastlane/Fastfile) and uploads to TestFlight.
# The GitHub Environment matching `env` supplies the secrets (including the
# whole .env.<env> file as APP_ENV_FILE), so give the `production` environment
# required reviewers.
#
# Cost notes: the JS quality gate runs on a Linux runner (macOS minutes cost
# ~10x). The macOS build is skipped when a build with the same expo-updates
# fingerprint and env file already reached TestFlight from a run of this
# workflow: ship JS-only changes with `yarn eas:update:<env>` instead, or set
# `force_build` (for example to bump IOS_APP_VERSION_NAME).
on:
  workflow_dispatch:
    inputs:
      env:
        description: App environment (scheme)
        type: choice
        options: [staging, production]
        default: staging
      force_build:
        description: Build even if this native fingerprint was already uploaded
        type: boolean
        default: false

concurrency:
  group: ios-release-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        # Includes module boundaries and the ESLint warning budget.
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --ci

      - name: Compute expo-updates fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          fingerprint="$(npx expo-updates fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "iOS runtime version (fingerprint): $fingerprint"
          printf 'hash=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

  build-and-upload:
    name: Build ${{ inputs.env }} & upload to TestFlight
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.env }}
    env:
      ENVFILE: .env.${{ inputs.env }}
      FINGERPRINT: ${{ needs.checks.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=()
          for var_name in APP_ENV_FILE APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY IOS_DEVELOPMENT_TEAM IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets in the '${{ inputs.env }}' environment:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Materialize env file
        # The whole .env.<env> file is stored as the APP_ENV_FILE secret of the
        # matching GitHub Environment (update it with `yarn env:push:<env>`).
        # Everything in it is bundled into the app by react-native-config, so it
        # must never contain signing material or other credentials; those stay
        # in their own secrets.* and are never written to this file.
        run: |
          set -euo pipefail
          printf '%s\n' "$APP_ENV_FILE" | tr -d '\r' > "$ENVFILE"
          for key in IOS_BUNDLE_ID IOS_APP_VERSION_NAME APP_NAME; do
            if ! grep -q "^${key}=" "$ENVFILE"; then
              echo "Missing ${key} in APP_ENV_FILE for '${{ inputs.env }}'." >&2
              exit 1
            fi
          done
          bundle_id="$(grep '^IOS_BUNDLE_ID=' "$ENVFILE" | cut -d= -f2-)"
          echo "Bundle id: $bundle_id"
          printf 'EXPECTED_IOS_BUNDLE_ID=%s\n' "$bundle_id" >> "$GITHUB_ENV"
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}

      - name: Compute release key
        # react-native-config compiles the env file into the native app, so a
        # changed env file needs a new build even when the fingerprint is the same.
        id: release-key
        run: |
          set -euo pipefail
          test -n "$FINGERPRINT"
          env_hash="$(shasum -a 256 "$ENVFILE" | cut -c1-16)"
          printf 'key=ios-release-%s-%s-%s\n' "${{ inputs.env }}" "$FINGERPRINT" "$env_hash" >> "$GITHUB_OUTPUT"

      - name: Look up previous build with the same fingerprint
        id: previous
        uses: actions/cache/restore@v5
        with:
          path: .release-marker
          key: ${{ steps.release-key.outputs.key }}
          lookup-only: true

      - name: Decide whether to build
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ steps.previous.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force_build }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: native build already on TestFlight"
              echo ""
              echo "A build with iOS fingerprint \`$FINGERPRINT\` and the same env file was already uploaded."
              echo "Ship JS changes with \`yarn eas:update:${{ inputs.env }} \"<message>\"\`, or re-run with **force_build** to upload a new binary."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipped: fingerprint $FINGERPRINT was already uploaded. Use EAS Update or force_build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve scheme for environment
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          case "${{ inputs.env }}" in
            staging)    scheme=Staging;    configuration=ReleaseStag ;;
            production) scheme=Production; configuration=ReleaseProd ;;
            *) echo "Unknown env: ${{ inputs.env }}" >&2; exit 1 ;;
          esac
          printf 'IOS_SCHEME=%s\n' "$scheme" >> "$GITHUB_ENV"
          printf 'IOS_CONFIGURATION=%s\n' "$configuration" >> "$GITHUB_ENV"

      - name: Setup Node
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          cache: yarn

      - name: Enable Corepack
        if: steps.gate.outputs.build == 'true'
        run: corepack enable

      - name: Setup Ruby (bundler)
        if: steps.gate.outputs.build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - name: Install ccache
        if: steps.gate.outputs.build == 'true'
        run: brew install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Restore ccache
        # Native (C/C++/Obj-C) objects from earlier runs. A new key every run so
        # the cache is always saved; restore-keys picks up the most recent one.
        # Xcode does not pass CCACHE_DIR to the compiler, so this is ccache's
        # default directory on macOS.
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-ios-${{ runner.os }}-

      - name: Restore CocoaPods cache
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-cache-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: pods-cache-${{ runner.os }}-

      - name: Install JS dependencies
        if: steps.gate.outputs.build == 'true'
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods
        # USE_CCACHE=1 makes react_native_post_install route every Pod target
        # through React Native's ccache-clang wrappers (no Podfile change, so the
        # fingerprint is unaffected).
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          bundle exec pod install --project-directory=ios
          # React Native also writes the ccache wrappers into the app project. That
          # file is part of the expo-updates fingerprint, so restore it: only Pod
          # targets (the bulk of the native code) go through ccache.
          if ! git diff --quiet -- ios/LingoBites.xcodeproj; then
            if git diff -U0 -- ios/LingoBites.xcodeproj | grep -E '^[+-][^+-]' | grep -qvE '^\+[[:space:]]*(CC|CXX|LD|LDPLUSPLUS|CCACHE_BINARY) = '; then
              echo "::warning::pod install changed ios/LingoBites.xcodeproj beyond the ccache settings; run 'yarn pod' locally and commit the result."
            else
              git checkout -- ios/LingoBites.xcodeproj
            fi
          fi
          if grep -q 'ccache-clang' ios/Pods/Pods.xcodeproj/project.pbxproj; then
            echo "ccache enabled for Pod targets."
          else
            echo "::warning::ccache wrappers missing from Pods.xcodeproj; native Pods compile without ccache."
          fi
        env:
          USE_CCACHE: '1'

      - name: Generate Xcode build config from env file
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          ruby ./node_modules/react-native-config/ios/ReactNativeConfig/BuildXCConfig.rb . ios/tmp.xcconfig

      - name: Preflight - assert resolved bundle id matches env file
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          resolved="$(xcodebuild -workspace ios/LingoBites.xcworkspace -scheme "$IOS_SCHEME" -configuration "$IOS_CONFIGURATION" -showBuildSettings 2>/dev/null | awk -F ' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2}')"
          echo "Resolved bundle id: $resolved"
          if [ "$resolved" != "$EXPECTED_IOS_BUNDLE_ID" ]; then
            echo "Resolved bundle id '$resolved' does not match IOS_BUNDLE_ID '$EXPECTED_IOS_BUNDLE_ID' from APP_ENV_FILE. Aborting." >&2
            exit 1
          fi
          if [ "${{ inputs.env }}" = "staging" ]; then
            case "$resolved" in
              *prod*|*Production*)
                echo "Resolved bundle id '$resolved' looks like a production identifier for a staging build. Aborting." >&2
                exit 1
                ;;
            esac
          fi

      - name: Materialize iOS signing files
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/lingobites-signing"
          certificate_path="$RUNNER_TEMP/lingobites-signing/distribution.p12"
          profile_path="$RUNNER_TEMP/lingobites-signing/app-store.mobileprovision"
          mkdir -p "$signing_dir"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          test -s "$certificate_path"
          test -s "$profile_path"
          security cms -D -i "$profile_path" >/dev/null

          printf 'IOS_DISTRIBUTION_CERTIFICATE_PATH=%s\n' "$certificate_path" >> "$GITHUB_ENV"
          printf 'IOS_PROVISIONING_PROFILE_PATH=%s\n' "$profile_path" >> "$GITHUB_ENV"
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Print expo-updates fingerprint
        # The runtime version this build embeds. An EAS update reaches it only
        # when `eas update` prints the same runtime version for ios.
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          fingerprint="$(npx expo-updates fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "iOS runtime version (fingerprint): $fingerprint"
          echo "iOS runtime version (fingerprint): \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fingerprint" != "$FINGERPRINT" ]; then
            echo "::warning::Fingerprint on macOS ($fingerprint) differs from the checks job ($FINGERPRINT); the skip check uses the checks job value."
          fi

      - name: Build and upload to TestFlight (fastlane ios ${{ inputs.env }})
        # Build number = latest TestFlight build number + 1 (computed by fastlane).
        if: steps.gate.outputs.build == 'true'
        run: bundle exec fastlane ios ${{ inputs.env }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.IOS_APPLE_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.IOS_APP_STORE_CONNECT_TEAM_ID }}
          # Embed the fingerprint from the checks job (the one the skip check and
          # `eas update` use) instead of re-hashing the tree mid-build, when the
          # build has already created files of its own.
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ env.FINGERPRINT }}

      - name: Verify embedded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          ipa="$(find . -name '*.ipa' -not -path './node_modules/*' | head -n 1)"
          if [ -z "$ipa" ]; then
            echo "::warning::No .ipa found; could not verify the embedded fingerprint."
            exit 0
          fi
          embedded="$(unzip -p "$ipa" 'Payload/*.app/EXUpdates.bundle/fingerprint')"
          echo "Embedded runtime version: $embedded"
          if [ "$embedded" != "$FINGERPRINT" ]; then
            echo "::error::The IPA embeds runtime version $embedded, expected $FINGERPRINT. EAS updates will not reach this build."
            exit 1
          fi

      - name: Show ccache stats
        if: always() && steps.gate.outputs.build == 'true'
        run: ccache -s || true

      - name: Record uploaded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        run: |
          mkdir -p .release-marker
          printf 'run=%s\nfingerprint=%s\n' "${{ github.run_id }}" "$FINGERPRINT" > .release-marker/info.txt

      - name: Save uploaded fingerprint
        if: success() && steps.gate.outputs.build == 'true'
        uses: actions/cache/save@v5
        with:
          path: .release-marker
          key: ${{ steps.release-key.outputs.key }}

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$ENVFILE" ios/tmp.xcconfig ios/.xcode.env.local
          rm -f "$RUNNER_TEMP/lingobites-signing/distribution.p12"
          rm -f "$RUNNER_TEMP/lingobites-signing/app-store.mobileprovision"
          rmdir "$RUNNER_TEMP/lingobites-signing" 2>/dev/null || true
          if security list-keychains | grep -q fastlane_tmp_keychain; then
            security delete-keychain fastlane_tmp_keychain || true
          fi
